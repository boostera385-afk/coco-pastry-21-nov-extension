<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coco Voice Dashboard</title>
  <meta name="description" content="Google Voice outreach, inbound activity and Claude coaching for your team.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="card login-card">
      <div class="brand-stripe" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 class="logo"><img src="icons/logo.svg" alt="" width="40" height="40">Coco <span>Voice</span></h1>
      <p id="loginIntro">Sign in to your team dashboard.</p>

      <div id="signinBlock">
        <div class="seg tabs" id="authTabs">
          <button type="button" data-t="password" class="on">Password</button>
          <button type="button" data-t="link">Email link / code</button>
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">

        <form id="pwForm">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password">
          <button class="btn" type="submit">Sign in</button>
          <a href="#" id="forgot" class="small link-under">Forgot password?</a>
        </form>
        <form id="loginForm" hidden>
          <p class="small">No password yet? We'll email you a one-time sign-in link and code. You can set a password after signing in.</p>
          <button class="btn" type="submit">Send sign-in email</button>
        </form>
        <form id="codeForm" hidden>
          <label for="code">Code from the email</label>
          <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="12345678">
          <button class="btn" type="submit">Sign in with code</button>
        </form>
      </div>

      <form id="newPwForm" hidden>
        <label for="newPw">New password (min 6, letters + numbers)</label>
        <input id="newPw" type="password" autocomplete="new-password" minlength="6">
        <label for="newPw2">Repeat new password</label>
        <input id="newPw2" type="password" autocomplete="new-password" minlength="6">
        <button class="btn" type="submit">Save password &amp; continue</button>
      </form>

      <p id="loginMsg" class="small" role="status"></p>
    </div>
    <footer class="legal">© <span class="cy">2026</span> Pastry Marketing. All rights reserved.</footer>
  </div>

  <div id="app" hidden>
    <div class="brand-stripe" aria-hidden="true"><i></i><i></i><i></i></div>
    <nav class="top">
      <a class="brand logo" href="#/overview"><img src="icons/logo.svg" alt="" width="34" height="34">Coco <span>Voice</span></a>
      <div class="links" id="navLinks"></div>
      <div class="me"><span id="meEmail" class="small"></span> <button class="btn dark" id="logout">Sign out</button></div>
    </nav>

    <section class="hero-band" id="filters">
      <div class="seg" id="range">
        <button data-r="today">Today</button>
        <button data-r="7d" class="on">7 days</button>
        <button data-r="30d">30 days</button>
        <button data-r="custom">Custom</button>
      </div>
      <span id="customRange" hidden>
        <input type="date" id="from"> <input type="date" id="to">
      </span>
      <select id="agentFilter"><option value="">All agents</option></select>
      <span class="small tz" id="tzLabel"></span>
    </section>

    <main id="view"></main>
    <footer class="legal">© <span class="cy">2026</span> Pastry Marketing. All rights reserved.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
