<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coco Voice Tracker</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="brand-stripe" aria-hidden="true"><i></i><i></i><i></i></div>
  <header>
    <h1>Coco <span>Voice</span></h1>
    <div class="actions">
      <button class="btn stop" id="pause" title="Pause / resume tracking">Pause</button>
      <button class="icon-btn" id="close" title="Close panel (tracking keeps running)" aria-label="Close panel">×</button>
    </div>
  </header>

  <section class="card status">
    <div><span class="dot" id="dot"></span> <b id="statusText">Checking…</b></div>
    <div class="small muted" id="who"></div>
    <div class="small muted" id="statusSub"></div>
    <button class="btn" id="openVoice" hidden>Open Google Voice</button>
    <button class="btn" id="setup" hidden>Paste your token</button>
  </section>

  <div class="seg" id="range">
    <button data-r="today" class="on">Today</button>
    <button data-r="7d">7 days</button>
    <button data-r="30d">30 days</button>
  </div>

  <section class="grid">
    <div class="card kpi hero wide">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M17 8h5M19.5 5.5 22 8l-2.5 2.5"/></svg></div>
      <div class="txt"><div class="label">Outbound reaches</div><div class="value" id="outboundReaches">0</div><div class="sub">unique contacts · once per contact per day</div></div>
    </div>
    <div class="card kpi y"><div class="ico">↗</div><div class="txt"><div class="label">Calls out</div><div class="value" id="outboundCalls">0</div><div class="sub" id="connected">0 connected</div></div></div>
    <div class="card kpi y"><div class="ico">✉</div><div class="txt"><div class="label">Texts out</div><div class="value" id="outboundTexts">0</div><div class="sub">sent</div></div></div>
    <div class="card kpi g" id="callsInTile"><div class="ico">↙</div><div class="txt"><div class="label">Calls in</div><div class="value" id="inboundCalls">0</div><div class="sub" id="missed">0 missed</div></div></div>
    <div class="card kpi g"><div class="ico">✉</div><div class="txt"><div class="label">Texts in</div><div class="value" id="inboundTexts">0</div><div class="sub" id="vm">0 voicemails</div></div></div>
  </section>

  <p class="small muted" id="since"></p>

  <footer>
    <button class="btn" id="sync">Sync now</button>
    <button class="btn dark" id="openDash">Dashboard</button>
    <a href="#" id="settings" class="small">Settings</a>
  </footer>
  <p class="small muted hint">Closing this panel keeps tracking on. Use Pause to stop.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
